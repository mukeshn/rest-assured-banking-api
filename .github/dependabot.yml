version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      selenium:
        patterns: ["org.seleniumhq.selenium:*"]
      test-frameworks:
        patterns: ["org.testng:*", "io.cucumber:*", "org.junit*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
