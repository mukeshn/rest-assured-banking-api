<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Transfer | Northbridge Bank</title><link rel="stylesheet" href="/assets/base.css"></head>
<body>
<main>
  <h1>New SEPA transfer</h1>
  <form id="transfer-form" class="card" novalidate data-testid="transfer-form">
    <label for="from">From account</label><select id="from" data-testid="from-account"></select>
    <p class="muted">Available: <span data-testid="available-balance"></span></p>
    <label for="beneficiary">Beneficiary name</label><input id="beneficiary" data-testid="beneficiary"><span class="error" data-error-for="beneficiaryName"></span>
    <label for="iban">IBAN</label><input id="iban" data-testid="iban" placeholder="DE00 0000 0000 0000 0000 00"><span class="error" data-error-for="iban"></span>
    <p class="muted" data-testid="iban-hint"></p>
    <div class="row">
      <div><label for="amount">Amount (EUR)</label><input id="amount" inputmode="decimal" data-testid="amount"><span class="error" data-error-for="amount"></span></div>
      <div><label for="date">Execution date</label><input id="date" type="date" data-testid="execution-date"></div>
    </div>
    <label for="reference">Reference</label><input id="reference" maxlength="140" data-testid="reference"><span class="muted" data-testid="reference-count">0/140</span>
    <div class="alert error hidden" role="alert" data-testid="transfer-error"></div>
    <p><button class="btn" data-testid="review">Review transfer</button></p>
  </form>
  <section class="card hidden" data-testid="review-panel">
    <h2>Please confirm</h2>
    <dl>
      <dt>To</dt><dd data-testid="review-beneficiary"></dd>
      <dt>IBAN</dt><dd data-testid="review-iban"></dd>
      <dt>Amount</dt><dd data-testid="review-amount"></dd>
      <dt>Execution</dt><dd data-testid="review-date"></dd>
    </dl>
    <button class="btn secondary" data-testid="edit">Edit</button>
    <button class="btn" data-testid="confirm">Confirm transfer</button>
  </section>
  <section class="card hidden" data-testid="result-panel">
    <div class="alert success" role="status" data-testid="transfer-success"></div>
    <p>Transfer ID: <strong data-testid="transfer-id"></strong></p>
    <p>Status: <strong data-testid="transfer-status"></strong></p>
    <a class="btn" href="/bank/dashboard.html" data-testid="back-to-accounts">Back to accounts</a>
  </section>
</main>
<script type="module">
  import { api, eur, formatIban, requireLogin, renderShell } from './app.js';
  requireLogin();
  renderShell('transfer');
  const $ = (s) => document.querySelector(s);
  const { accounts } = await api('/api/bank/accounts');
  const transferable = accounts.filter((a) => a.type !== 'CREDIT_CARD');
  $('#from').innerHTML = transferable.map((a) => `<option value="${a.id}">${a.name} - ${formatIban(a.iban)}</option>`).join('');
  const showAvail = () => { $('[data-testid="available-balance"]').textContent = eur(transferable.find((a) => a.id === $('#from').value).balance); };
  $('#from').addEventListener('change', showAvail); showAvail();
  $('#reference').addEventListener('input', () => { $('[data-testid="reference-count"]').textContent = `${$('#reference').value.length}/140`; });
  $('#iban').addEventListener('blur', async () => {
    if (!$('#iban').value) return;
    const v = await api('/api/bank/iban/validate', { method: 'POST', body: { iban: $('#iban').value } });
    $('#iban').value = formatIban(v.iban);
    $('[data-testid="iban-hint"]').textContent = v.valid ? (v.bankCode ? `Bank code (BLZ): ${v.bankCode}` : 'IBAN looks valid') : '';
    $('[data-error-for="iban"]').textContent = v.valid ? '' : 'Please check the IBAN.';
  });
  let payload;
  const parseAmount = (s) => Number(String(s).trim().replace(/\./g, '').replace(',', '.'));
  $('#transfer-form').addEventListener('submit', (e) => {
    e.preventDefault();
    document.querySelectorAll('[data-error-for]').forEach((el) => (el.textContent = ''));
    $('[data-testid="transfer-error"]').classList.add('hidden');
    const amount = parseAmount($('#amount').value);
    let ok = true;
    if ($('#beneficiary').value.trim().length < 2) { $('[data-error-for="beneficiaryName"]').textContent = 'Please enter the beneficiary name.'; ok = false; }
    if (!$('#iban').value.trim()) { $('[data-error-for="iban"]').textContent = 'Please enter an IBAN.'; ok = false; }
    if (!(amount > 0)) { $('[data-error-for="amount"]').textContent = 'Please enter an amount greater than 0.'; ok = false; }
    if (!ok) return;
    payload = { fromAccountId: $('#from').value, beneficiaryName: $('#beneficiary').value.trim(), iban: $('#iban').value.replace(/\s+/g, ''), amount, reference: $('#reference').value, executionDate: $('#date').value || undefined };
    $('[data-testid="review-beneficiary"]').textContent = payload.beneficiaryName;
    $('[data-testid="review-iban"]').textContent = formatIban(payload.iban.toUpperCase());
    $('[data-testid="review-amount"]').textContent = eur(amount);
    $('[data-testid="review-date"]').textContent = payload.executionDate || 'Today';
    $('#transfer-form').classList.add('hidden');
    $('[data-testid="review-panel"]').classList.remove('hidden');
  });
  $('[data-testid="edit"]').addEventListener('click', () => { $('[data-testid="review-panel"]').classList.add('hidden'); $('#transfer-form').classList.remove('hidden'); });
  $('[data-testid="confirm"]').addEventListener('click', async () => {
    try {
      const t = await api('/api/bank/transfers', { method: 'POST', body: payload });
      $('[data-testid="review-panel"]').classList.add('hidden');
      $('[data-testid="result-panel"]').classList.remove('hidden');
      $('[data-testid="transfer-success"]').textContent = t.status === 'SCHEDULED' ? `Your transfer of ${eur(t.amount)} has been scheduled.` : `${eur(t.amount)} sent to ${t.beneficiaryName}.`;
      $('[data-testid="transfer-id"]').textContent = t.id;
      $('[data-testid="transfer-status"]').textContent = t.status;
    } catch (ex) {
      const msg = { INSUFFICIENT_FUNDS: 'Insufficient funds for this transfer.', DAILY_LIMIT_EXCEEDED: `This transfer exceeds your daily limit. Remaining today: ${eur(ex.data?.remaining ?? 0)}.` }[ex.data?.error];
      if (ex.data?.errors) ex.data.errors.forEach((er) => { const el = document.querySelector(`[data-error-for="${er.field}"]`); if (el) el.textContent = er.message; });
      $('[data-testid="transfer-error"]').textContent = msg || 'The transfer could not be completed. Please check your input.';
      $('[data-testid="transfer-error"]').classList.remove('hidden');
      $('[data-testid="review-panel"]').classList.add('hidden');
      $('#transfer-form').classList.remove('hidden');
    }
  });
</script>
</body>
</html>
